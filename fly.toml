# fly.toml app configuration file generated for rails-blog-nem-ug on 2026-07-03T11:22:47Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'rails-blog-nem-ug'
primary_region = 'iad'
console_command = '/rails/bin/rails console'

[env]
  PORT = 8080

[build]

[[mounts]]
  source = 'data'
  destination = '/data'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 256

[[statics]]
  guest_path = '/rails/public'
  url_prefix = '/'
